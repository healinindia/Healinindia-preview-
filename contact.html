<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Medcurex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Contact Medcurex</h1>
            <p>Get in touch with us for consultations or inquiries.</p>
        </div>
    </header>

    <section class="contact-form">
        <h2>Reach Out to Us</h2>
        <form action="mailto:healinindia5@gmail.com" method="post" enctype="text/plain">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" required></textarea>

            <input type="submit" value="Send Message">
        </form>
    </section>

    <footer>
        <p>© 2025 Medcurex. All Rights Reserved.</p>
    </footer>
</body>
</html>
